<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#123B63" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HOSTERA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="HOSTERA — Global Hospitality Operating System. One platform. Every property. Everywhere. Developed by Liafrik." />
    <title>HOSTERA — Global Hospitality Operating System</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Last-resort safety net: if the app script fails to load or throws
      // before React mounts (a module-level error, a bad deploy, a network
      // failure on a chunk), #root would otherwise stay empty forever with
      // no explanation. This runs independently of the app bundle itself,
      // so it still works even when that bundle is the thing that's broken.
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;gap:12px;font-family:sans-serif;' +
            'text-align:center;padding:24px;">' +
            '<h1 style="font-size:16px;font-weight:600;color:#111;">Unable to load this page</h1>' +
            '<p style="font-size:13px;color:#666;max-width:360px;">' +
            'Something went wrong while loading the app. Reloading usually fixes this.' +
            '</p>' +
            '<button onclick="window.location.reload()" style="padding:8px 16px;' +
            'border-radius:8px;background:#111;color:#fff;border:none;font-size:13px;">' +
            'Reload</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
